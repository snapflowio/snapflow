layer: "library"
stack: "systems"
tags: ["contracts", "payments"]

fileGroups:
  production:
    - "**/*"
    - "!**/*_test.go"

tasks:
  generate:
    script: >-
      (cd ../../apps/contracts && forge inspect SnapflowEscrow abi --json) > escrow/snapflow_escrow.abi.json
      && go run github.com/ethereum/go-ethereum/cmd/abigen@v1.17.10 --v2
      --abi escrow/snapflow_escrow.abi.json --pkg escrow --type SnapflowEscrow --out escrow/snapflow_escrow.gen.go
    deps: ["contracts:build"]
    inputs: ["/apps/contracts/src/**/*.sol"]
    outputs: ["escrow"]

  build:
    command: "go"
    args: ["build", "./..."]
    inputs: ["@group(production)"]
