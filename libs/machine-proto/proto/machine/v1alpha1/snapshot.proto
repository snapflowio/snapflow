syntax = "proto3";

package machine.v1alpha1;

import "machine/v1alpha1/job.proto";

option go_package = "github.com/snapflowio/snapflow/libs/machine-proto/gen/go/machine/v1alpha1;machinev1alpha1";

message SnapshotRegistrySource {
  optional string registry_id = 1;
}

message SnapshotLocalSource {}

enum SnapshotRetention {
  SNAPSHOT_RETENTION_UNSPECIFIED = 0;
  SNAPSHOT_RETENTION_REQUIRED = 1;
  SNAPSHOT_RETENTION_PREWARM = 2;
}

message DesiredSnapshot {
  string ref = 1;
  optional string digest = 2;
  oneof source {
    SnapshotRegistrySource registry = 3;
    SnapshotLocalSource    local    = 4;
  }
  optional TemplatePreparation template = 5;
  SnapshotRetention retention = 6;
}

enum SnapshotInventoryState {
  SNAPSHOT_INVENTORY_STATE_UNSPECIFIED = 0;
  SNAPSHOT_INVENTORY_STATE_PRESENT = 1;
  SNAPSHOT_INVENTORY_STATE_PULLING = 2;
  SNAPSHOT_INVENTORY_STATE_FAILED = 3;
}

message ObservedSnapshot {
  string                    ref          = 1;
  SnapshotInventoryState    state        = 2;
  optional string           digest       = 3;
  int64                     size_bytes   = 4;
  optional string           error_reason = 5;
  optional PreparedTemplate template     = 6;
}

message MachineSnapshotInventory {
  uint64                    desired_state_revision = 1;
  repeated ObservedSnapshot snapshots              = 2;
}

message SnapshotRegistryCredentials {
  string   registry_id = 1;
  Registry registry    = 2;
}
