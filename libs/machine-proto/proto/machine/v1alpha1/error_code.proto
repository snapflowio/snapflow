syntax = "proto3";
package machine.v1alpha1;

option go_package = "github.com/snapflowio/snapflow/libs/machine-proto/gen/go/machine/v1alpha1;machinev1alpha1";

enum MachineErrorCode {
  MACHINE_ERROR_CODE_UNSPECIFIED = 0;
  MACHINE_ERROR_CODE_NONE = 1;
  MACHINE_ERROR_CODE_INVALID_REQUEST = 2;
  MACHINE_ERROR_CODE_STALE_ASSIGNMENT = 3;
  MACHINE_ERROR_CODE_NOT_FOUND = 4;
  MACHINE_ERROR_CODE_IMAGE_INVALID = 5;
  MACHINE_ERROR_CODE_IMAGE_UNAVAILABLE = 6;
  MACHINE_ERROR_CODE_SNAPSHOT_CORRUPT = 7;
  MACHINE_ERROR_CODE_PLATFORM_BUNDLE_FETCH_FAILED = 8;
  MACHINE_ERROR_CODE_PLATFORM_BUNDLE_MOUNT_FAILED = 9;
  MACHINE_ERROR_CODE_PLATFORM_COMPONENT_NOT_FOUND = 10;
  MACHINE_ERROR_CODE_PLATFORM_COMPONENT_NOT_EXECUTABLE = 11;
  MACHINE_ERROR_CODE_GUEST_AUTHENTICATION_FAILED = 12;
  MACHINE_ERROR_CODE_RUNTIME_UNAVAILABLE = 13;
  MACHINE_ERROR_CODE_GUEST_NOT_READY = 14;
  MACHINE_ERROR_CODE_HOST_IO_FAILED = 15;
  MACHINE_ERROR_CODE_RUNTIME_MISSING = 16;
  MACHINE_ERROR_CODE_INSUFFICIENT_CAPACITY = 17;
  MACHINE_ERROR_CODE_CANCELLED = 18;
  MACHINE_ERROR_CODE_DEADLINE_EXCEEDED = 19;
  MACHINE_ERROR_CODE_UNKNOWN = 20;
}
