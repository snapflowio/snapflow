syntax = "proto3";

package machine.v1alpha1;

import "google/protobuf/timestamp.proto";
import "machine/v1alpha1/error_code.proto";
import "machine/v1alpha1/job.proto";
import "machine/v1alpha1/snapshot.proto";

option go_package = "github.com/snapflowio/snapflow/libs/machine-proto/gen/go/machine/v1alpha1;machinev1alpha1";

enum SandboxLifecycle {
  SANDBOX_LIFECYCLE_UNSPECIFIED = 0;
  SANDBOX_LIFECYCLE_STARTED = 1;
  SANDBOX_LIFECYCLE_STOPPED = 2;
  SANDBOX_LIFECYCLE_PAUSED = 3;
  SANDBOX_LIFECYCLE_DESTROYED = 4;
}

message SandboxResources {
  int32 cpu_quota     = 1;
  int32 gpu_quota     = 2;
  int32 memory_quota  = 3;
  int32 storage_quota = 4;
}

message NetworkPolicy {
  optional bool   block_all            = 1;
  optional string allow_list           = 2;
  optional string domain_allow_list    = 3;
  optional uint64 egress_bandwidth_bps = 4;
}

message SandboxImage {
  string          ref        = 1;
  repeated string entrypoint = 2;
}

message SandboxBackupSource {
  string ref = 1;
}

message SandboxForkSource {
  string source_sandbox_id = 1;
}

message SandboxSpec {
  string                    mode              = 1;
  repeated string           capabilities      = 2;
  optional string           name              = 3;
  string                    user_id           = 4;
  string                    os_user           = 5;
  SandboxResources          resources         = 6;
  map<string, string>       env               = 7;
  repeated VolumeAttachment volumes           = 8;
  NetworkPolicy             network           = 9;
  map<string, string>       labels            = 10;
  optional string           linked_sandbox_id = 11;
  oneof source {
    SandboxImage        image  = 12;
    SandboxBackupSource backup = 13;
    SandboxForkSource   fork   = 14;
  }
}

message SandboxRecovery {
  optional string error_reason        = 1;
  optional string backup_error_reason = 2;
}

message SandboxDirectives {
  bool                     force_stop = 1;
  optional SandboxRecovery recovery   = 2;
}

message SandboxDesiredState {
  string            sandbox_id            = 1;
  uint32            assignment_generation = 2;
  uint32            spec_generation       = 3;
  SandboxLifecycle  lifecycle             = 4;
  SandboxSpec       spec                  = 5;
  string            spec_digest           = 6;
  SandboxDirectives directives            = 7;
  bool              has_secrets           = 8;
}

message MachineDesiredState {
  uint64                       revision     = 1;
  google.protobuf.Timestamp    generated_at = 2;
  google.protobuf.Timestamp    expires_at   = 3;
  string                       digest       = 4;
  repeated SandboxDesiredState sandboxes    = 5;
  repeated DesiredSnapshot     snapshots    = 6;
}

enum SandboxRuntimeState {
  SANDBOX_RUNTIME_STATE_UNSPECIFIED = 0;
  SANDBOX_RUNTIME_STATE_CREATING = 1;
  SANDBOX_RUNTIME_STATE_STARTED = 2;
  SANDBOX_RUNTIME_STATE_STOPPED = 3;
  SANDBOX_RUNTIME_STATE_PAUSED = 4;
  SANDBOX_RUNTIME_STATE_DESTROYED = 5;
  SANDBOX_RUNTIME_STATE_ERROR = 6;
  SANDBOX_RUNTIME_STATE_MISSING = 7;
}

message ConvergenceResult {
  string              phase            = 1;
  MachineErrorCode     error_code       = 2;
  bool                retryable        = 3;
  optional string     diagnostic       = 4;
  string              runtime_identity = 5;
  string              release_identity = 6;
  map<string, uint32> timings_ms       = 7;
  map<string, string> evidence         = 8;
}

message SandboxObservedStatus {
  string                    sandbox_id               = 1;
  uint32                    assignment_generation    = 2;
  uint32                    observed_spec_generation = 3;
  SandboxRuntimeState       state                    = 4;
  optional string           error_reason             = 5;
  bool                      recoverable              = 6;
  google.protobuf.Timestamp observed_at              = 7;
  optional string           daemon_version           = 8;
  optional ConvergenceResult result                  = 9;
}

message SandboxObservedStatusReport {
  uint64                         desired_state_revision = 1;
  repeated SandboxObservedStatus statuses               = 2;
}

enum SandboxObservedStatusVerdict {
  SANDBOX_OBSERVED_STATUS_VERDICT_UNSPECIFIED = 0;
  SANDBOX_OBSERVED_STATUS_VERDICT_ACCEPTED = 1;
  SANDBOX_OBSERVED_STATUS_VERDICT_STALE = 2;
  SANDBOX_OBSERVED_STATUS_VERDICT_UNKNOWN = 3;
  SANDBOX_OBSERVED_STATUS_VERDICT_INVALID = 4;
}

message SandboxObservedStatusAcknowledgement {
  string                       sandbox_id = 1;
  SandboxObservedStatusVerdict verdict    = 2;
  optional string              reason     = 3;
}

message SandboxObservedStatusReportResult {
  repeated SandboxObservedStatusAcknowledgement acknowledgements = 1;
}

message SandboxSecrets {
  string              sandbox_id            = 1;
  uint32              assignment_generation = 2;
  uint32              spec_generation       = 3;
  map<string, string> env                   = 4;
}
