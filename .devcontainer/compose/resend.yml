services:
  resend:
    image: node:26.13.1-alpine3.24@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
    mem_limit: 256m
    command:
      [
        "npx",
        "--yes",
        "emulate@0.12.2",
        "start",
        "--service",
        "resend",
        "--host",
        "0.0.0.0",
        "--port",
        "4008",
      ]
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    volumes:
      - resend-npm-cache:/root/.npm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4008/emails"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

volumes:
  resend-npm-cache:
