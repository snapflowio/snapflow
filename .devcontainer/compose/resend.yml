services:
  resend:
    image: node:22.23.1-alpine3.23@sha256:8516dce0483394d5708d4b2ee6cacb79fb1d617ea4e2787c2120bcca92ce372e
    mem_limit: 256m
    command:
      [
        "npx",
        "--yes",
        "emulate@0.12.2",
        "start",
        "--service",
        "resend",
        "--host",
        "0.0.0.0",
        "--port",
        "4008",
      ]
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
    volumes:
      - resend-npm-cache:/root/.npm
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4008/emails"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

volumes:
  resend-npm-cache:
