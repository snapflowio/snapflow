services:
  registry:
    image: registry:3.1.2@sha256:82f6ff4a7f982960c8aa51617fea3aabc485df6e55cce80d22deb1de36f1bc3c
    mem_limit: 256m
    volumes:
      - registry-data:/var/lib/registry
      - ../dev/registry/config.yml:/etc/docker/registry/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  buildkit:
    image: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
    privileged: true
    command:
      ["--addr", "tcp://0.0.0.0:1234", "--config", "/etc/buildkit/buildkitd.toml"]
    volumes:
      - buildkit-data:/var/lib/buildkit
      - ../dev/buildkit/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  registry-data:
  buildkit-data:
