services:
  devcontainer:
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}
      XDG_SESSION_TYPE: ${XDG_SESSION_TYPE:-wayland}
      PULSE_SERVER: ${PULSE_SERVER:-unix:/mnt/wslg/PulseServer}
    volumes:
      - type: bind
        source: /mnt/wslg
        target: /mnt/wslg
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /mnt/wslg/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: true
