apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapflow-openbao-configure
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: snapflow-openbao-configure
  namespace: openbao
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: snapflow-openbao-configure
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
          command: ["/bin/sh", "/etc/snapflow/configure.sh"]
          env:
            - name: BAO_ADDR
              value: http://openbao.openbao.svc:8200
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /etc/snapflow
              readOnly: true
            - name: token
              mountPath: /var/run/secrets/openbao
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: snapflow-openbao-configure
        - name: token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 3600
        - name: tmp
          emptyDir: {}
