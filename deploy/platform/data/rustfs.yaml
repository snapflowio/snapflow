apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: snapflow-rustfs
  namespace: snapflow
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: snapflow
spec:
  replicas: 1
  serviceName: snapflow-rustfs
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/part-of: snapflow
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: docker.io/rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: snapflow-rustfs
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: snapflow-rustfs
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: s3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: snapflow-rustfs
  namespace: snapflow
spec:
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: snapflow-storage
  namespace: snapflow
spec:
  secretName: snapflow-storage-tls
  dnsNames:
    - ${STORAGE_DOMAIN}
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snapflow-rustfs
  namespace: snapflow
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${STORAGE_DOMAIN}
      secretName: snapflow-storage-tls
  rules:
    - host: ${STORAGE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: snapflow-rustfs
                port:
                  number: 9000
