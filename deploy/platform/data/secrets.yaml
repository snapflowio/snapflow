apiVersion: v1
kind: Namespace
metadata:
  name: snapflow
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-redis
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-redis
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        redis.conf: |
          requirepass {{ .password }}
          appendonly yes
          dir /data
  dataFrom:
    - extract:
        key: snapflow/platform/redis
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-rustfs
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-rustfs
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapflow/platform/rustfs
