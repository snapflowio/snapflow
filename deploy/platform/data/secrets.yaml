apiVersion: v1
kind: Namespace
metadata:
  name: snapflow
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-redis
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-redis
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        redis.conf: |
          requirepass {{ .password }}
          appendonly yes
          dir /data
  dataFrom:
    - extract:
        key: snapflow/platform/redis
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-rustfs
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-rustfs
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: snapflow/platform/rustfs
---
# The read-only Postgres login for database tools; postgres.yaml declares the
# role. CloudNativePG reloads the role's password when this secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-postgres-readonly
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-postgres-readonly
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: snapflow/platform/postgres-readonly
