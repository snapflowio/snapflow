apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-redis
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-redis
    creationPolicy: Owner
    template:
      data:
        password: "{{ .password }}"
        redis.conf: |
          requirepass {{ .password }}
          appendonly yes
          dir /data
          maxmemory 384mb
          maxmemory-policy noeviction
  dataFrom:
    - extract:
        key: snapflow/platform/redis
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-postgres-readonly
  namespace: snapflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: snapflow-postgres-readonly
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  dataFrom:
    - extract:
        key: snapflow/platform/postgres-readonly
