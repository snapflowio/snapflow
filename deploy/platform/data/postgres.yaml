apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snapflow-postgres
  namespace: snapflow
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie@sha256:78c4fdf165e8ffb1b5b7a7fc6b22b3cf37890a338b4c1c8c4d913896129a86da
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: snapflow
      owner: snapflow
  # A login for database tools that can read every table and change nothing;
  # pg_read_all_data is PostgreSQL's built-in role for that. Its password is
  # snapflow/platform/postgres-readonly, shown in the OpenBao UI. Postgres has
  # no public port: in DataGrip, tunnel over SSH through the server and use
  # host `kubectl -n snapflow get service snapflow-postgres-rw -o
  # jsonpath='{.spec.clusterIP}'`, port 5432, database snapflow, user
  # snapflow_readonly. The snapflow owner login is for the api only.
  managed:
    roles:
      - name: snapflow_readonly
        ensure: present
        login: true
        connectionLimit: 5
        passwordSecret:
          name: snapflow-postgres-readonly
        inRoles:
          - pg_read_all_data
  # WAL is archived continuously and base backups are taken daily
  # (snapflow-postgres-daily), so the database can be restored to any point in
  # the retention window.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: snapflow-postgres-backups
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
