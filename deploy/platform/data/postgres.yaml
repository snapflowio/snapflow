apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snapflow-postgres
  namespace: snapflow
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-standard-trixie@sha256:78c4fdf165e8ffb1b5b7a7fc6b22b3cf37890a338b4c1c8c4d913896129a86da
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: snapflow
      owner: snapflow
  # WAL is archived continuously and base backups are taken daily
  # (snapflow-postgres-daily), so the database can be restored to any point in
  # the retention window.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: snapflow-postgres-backups
  storage:
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
