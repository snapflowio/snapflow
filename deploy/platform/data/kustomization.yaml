apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.yaml
  - postgres.yaml
  - postgres-backups.yaml
  - postgres-restore-drill.yaml
  - redis.yaml
  - network-policies.yaml
configMapGenerator:
  - name: postgres-restore-drill
    namespace: snapflow
    files:
      - postgres-restore-drill.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
