apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: origin
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 10m
  timeout: 15m
  path: ./deploy/apps/production/origin
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
