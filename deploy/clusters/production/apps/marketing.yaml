apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: marketing
  namespace: flux-system
spec:
  dependsOn:
    - name: public-ingress
  interval: 10m
  timeout: 15m
  path: ./deploy/apps/production/marketing
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
