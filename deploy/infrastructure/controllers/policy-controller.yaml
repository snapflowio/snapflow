apiVersion: v1
kind: Namespace
metadata:
  name: policy-controller
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sigstore
  namespace: policy-controller
spec:
  interval: 24h
  url: https://sigstore.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-controller
  namespace: policy-controller
spec:
  interval: 1h
  dependsOn:
    - name: prometheus-operator-crds
      namespace: monitoring
  chart:
    spec:
      chart: policy-controller
      version: 0.10.8
      sourceRef:
        kind: HelmRepository
        name: sigstore
  values:
    cosign:
      webhookTimeoutSeconds:
        mutating: 20
        validating: 20
    webhook:
      replicaCount: 1
      failurePolicy: Fail
      configData:
        no-match-policy: allow
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi
    serviceMonitor:
      enabled: true
