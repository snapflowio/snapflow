apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    service:
      spec:
        type: ClusterIP
    ports:
      cloudflare:
        port: 8444
        hostPort: 9444
        expose:
          default: false
        exposedPort: 9444
        protocol: TCP
        http:
          middlewares:
            - kube-system-cloudflare-only@kubernetescrd
          tls:
            enabled: true
        forwardedHeaders:
          trustedIPs: &cloudflareRanges
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
        transport: &cloudflareTransport
          respondingTimeouts:
            readTimeout: 60s
            idleTimeout: 180s
      origin:
        port: 8445
        expose:
          default: true
        exposedPort: 8445
        protocol: TCP
        proxyProtocol:
          trustedIPs:
            - 10.42.0.0/16
        http:
          middlewares:
            - kube-system-cloudflare-only@kubernetescrd
          tls:
            enabled: true
        forwardedHeaders:
          trustedIPs: *cloudflareRanges
        transport: *cloudflareTransport
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-only
  namespace: kube-system
spec:
  ipAllowList:
    sourceRange:
      - 173.245.48.0/20
      - 103.21.244.0/22
      - 103.22.200.0/22
      - 103.31.4.0/22
      - 141.101.64.0/18
      - 108.162.192.0/18
      - 190.93.240.0/20
      - 188.114.96.0/20
      - 197.234.240.0/22
      - 198.41.128.0/17
      - 162.158.0.0/15
      - 104.16.0.0/13
      - 104.24.0.0/14
      - 172.64.0.0/13
      - 131.0.72.0/22
      - 2400:cb00::/32
      - 2606:4700::/32
      - 2803:f800::/32
      - 2405:b500::/32
      - 2405:8100::/32
      - 2a06:98c0::/29
      - 2c0f:f248::/32
