apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 24h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  chart:
    spec:
      chart: openbao
      version: 0.30.4
      sourceRef:
        kind: HelmRepository
        name: openbao
  values:
    injector:
      enabled: false
    csi:
      enabled: false
    ui:
      enabled: false
    server:
      image:
        registry: quay.io
        repository: openbao/openbao
        tag: 2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
      dataStorage:
        enabled: true
        size: 10Gi
      volumes:
        - name: seal
          secret:
            secretName: openbao-seal
      volumeMounts:
        - name: seal
          mountPath: /openbao/seal
          readOnly: true
      standalone:
        enabled: false
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true
          config: |
            # The web UI is how the operator manages secrets. The service is
            # cluster-internal and reached only by port-forward
            # (moon run deploy:openbao).
            ui = true

            listener "tcp" {
              tls_disable     = 1
              address         = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/openbao/data"
            }

            service_registration "kubernetes" {}

            seal "static" {
              current_key_id = "snapflow-1"
              current_key    = "file:///openbao/seal/key"
            }

            initialize "kubernetes_auth" {
              request "enable_kubernetes" {
                operation = "update"
                path      = "sys/auth/kubernetes"
                data = {
                  type = "kubernetes"
                }
              }

              request "configure_kubernetes" {
                operation = "update"
                path      = "auth/kubernetes/config"
                data = {
                  kubernetes_host = "https://kubernetes.default.svc"
                }
              }
            }

            initialize "configure_job" {
              request "configure_policy" {
                operation = "update"
                path      = "sys/policies/acl/snapflow-configure"
                data = {
                  policy = <<-POLICY
                    path "sys/mounts/*" { capabilities = ["create", "read", "update"] }
                    path "sys/mounts" { capabilities = ["read"] }
                    path "sys/policies/acl/*" { capabilities = ["create", "read", "update"] }
                    path "auth/kubernetes/role/*" { capabilities = ["create", "read", "update"] }
                    path "pki/*" { capabilities = ["create", "read", "update", "list"] }
                    path "secret/data/snapflow/*" { capabilities = ["create", "read", "update"] }
                    path "secret/metadata/snapflow/*" { capabilities = ["read", "list"] }
                  POLICY
                }
              }

              request "configure_role" {
                operation = "update"
                path      = "auth/kubernetes/role/snapflow-configure"
                data = {
                  bound_service_account_names      = ["snapflow-openbao-configure"]
                  bound_service_account_namespaces = ["openbao"]
                  audience                         = "openbao"
                  token_policies                   = ["snapflow-configure"]
                  token_ttl                        = "15m"
                }
              }
            }
