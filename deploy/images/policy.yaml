apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: snapflow-api
  namespace: flux-system
spec:
  interval: 5m
  image: ghcr.io/snapflowio/snapflow/api
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: snapflow-api
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: snapflow-api
  digestReflectionPolicy: Always
  interval: 5m
  filterTags:
    pattern: '^build-[a-f0-9]{40}-(?P<timestamp>[0-9]+)$'
    extract: '$timestamp'
  policy:
    numerical:
      order: asc
---
