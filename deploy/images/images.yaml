apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: snapflow
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Images are built only from dev, so their digests are pinned on dev and
  # reach production through the dev -> main promotion. Nothing writes main
  # directly, which keeps a revert on main in place.
  git:
    checkout:
      ref:
        branch: dev
    commit:
      author:
        name: snapflow-flux
        email: flux@snapflow.io
      messageTemplate: |
        chore(deploy): pin images built from dev

        {{ range .Changed.Changes }}{{ print .OldValue }} -> {{ println .NewValue }}{{ end }}
    push:
      branch: dev
  update:
    path: ./deploy/apps/production
    strategy: Setters
