apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: snapflow
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Images are built only from main, so their digests are pinned on main,
  # which Flux deploys. Main's workflow ignores deploy/apps/production, so a
  # pin commit neither reruns CI nor rebuilds images.
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: snapflow-flux
        email: flux@snapflow.io
      messageTemplate: |
        chore(deploy): pin images built from main

        {{ range .Changed.Changes }}{{ print .OldValue }} -> {{ println .NewValue }}{{ end }}
    push:
      branch: main
  update:
    path: ./deploy/apps/production
    strategy: Setters
