token: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN', default=undef(hint='Set K3S_TOKEN to the control plane node token')) }}"

agent_config_yaml: |
  {{ {
    'node-name': inventory_hostname,
    'node-ip': node_ip,
    'node-external-ip': public_ip,
    'node-label': ['snapflow.io/edge=true'],
    'node-taint': ['snapflow.io/edge=true:NoSchedule'],
  } | to_nice_yaml }}
