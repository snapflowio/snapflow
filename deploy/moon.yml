layer: "configuration"
stack: "infrastructure"
tags:
  - "scope-deployment"

fileGroups:
  manifests:
    - "**/*"

tasks:
  validate:
    description: "Lints the Helm chart and validates every Flux kustomization against the Kubernetes and CRD schemas"
    command: "bash"
    args: ["deploy/scripts/validate.sh"]
    inputs:
      - "@group(manifests)"
    options:
      runFromWorkspaceRoot: true

  bootstrap:
    description: "Creates the OpenBao seal key if missing and installs the Flux Operator and FluxInstance on the cluster in KUBECONFIG"
    command: "bash"
    args: ["deploy/scripts/bootstrap-flux.sh"]
    deps:
      - "validate"
    options:
      cache: false
      interactive: true
      runInCI: false
      runFromWorkspaceRoot: true

  openbao:
    description: "Opens a shell logged in to the cluster's OpenBao for entering and rotating secrets"
    command: "bash"
    args: ["deploy/scripts/openbao-shell.sh"]
    options:
      cache: false
      interactive: true
      runInCI: false
      runFromWorkspaceRoot: true

  secrets:
    description: "Validates the secrets files in deploy/secrets/production and writes every changed file to OpenBao"
    command: "bash"
    args: ["deploy/scripts/push-secrets.sh"]
    options:
      cache: false
      runInCI: false
      runFromWorkspaceRoot: true

  reconcile:
    description: "Makes Flux pull main and apply every stage now"
    command: "flux"
    args: ["reconcile", "kustomization", "flux-system", "--with-source"]
    options:
      cache: false
      runInCI: false

  status:
    description: "Shows the state of every Flux stage, Helm release and image policy"
    command: "flux"
    args: ["get", "all", "--all-namespaces"]
    options:
      cache: false
      runInCI: false
