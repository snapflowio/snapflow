apiVersion: v1
kind: ConfigMap
metadata:
  name: snapflow-openbao-proxy
  labels:
    {{- include "snapflow.labels" (dict "root" . "component" "api") | nindent 4 }}
data:
  proxy.hcl: |
    vault {
      address = "{{ .Values.openbao.address }}"
    }

    auto_auth {
      method "kubernetes" {
        config = {
          role       = "{{ .Values.openbao.authRole }}"
          token_path = "/var/run/secrets/openbao/token"
        }
      }
    }

    api_proxy {
      use_auto_auth_token = "force"
    }

    listener "tcp" {
      address                = "127.0.0.1:8100"
      tls_disable            = true
      require_request_header = true
    }
