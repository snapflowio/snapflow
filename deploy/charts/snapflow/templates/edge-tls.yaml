{{- if eq .Values.component "api" }}
{{- $root := . -}}
{{- $platform := required "domains.platform is required" .Values.domains.platform -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: snapflow-edge
  labels:
    {{- include "snapflow.labels" (dict "root" $root "component" "edge") | nindent 4 }}
spec:
  secretName: snapflow-edge-tls
  dnsNames:
    - {{ $platform | quote }}
    - {{ printf "*.%s" $platform | quote }}
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.clusterIssuer }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snapflow-edge-trust
  labels:
    {{- include "snapflow.labels" (dict "root" $root "component" "edge") | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.secretStore }}
  target:
    name: snapflow-edge-trust
    creationPolicy: Owner
  data:
    - secretKey: tunnel-client-ca.pem
      remoteRef:
        key: snapflow/edge/tunnel-client-ca
        property: certificate
    - secretKey: origin-client-ca.pem
      remoteRef:
        key: snapflow/cloudflare/origin-pull-ca
        property: certificate
{{- end }}
