imageNamespace: ""

images:
  api:
    tag: ""
    digest: ""
  dashboard:
    tag: ""
    digest: ""
  marketing:
    tag: ""
    digest: ""
  snapshotManager:
    tag: ""
    digest: ""
  edge:
    tag: ""
    digest: ""


domains:
  public: ""
  storage: ""
  registry: ""
  platform: ""

clusterIssuer: letsencrypt

email:
  from: ""
  replyTo: ""

directHttpsPort: 9443

secretStore: openbao

clusterPodCidr: 10.42.0.0/16

openbao:
  address: http://openbao.openbao.svc:8200
  image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
  authRole: snapflow-api
  tokenAudience: openbao
  userId: 100
  groupId: 1000

database:
  cluster: snapflow-postgres
  poolMax: 10
  poolIdleTimeoutMs: 30000
  connectionTimeoutMs: 30000

redis:
  service: snapflow-redis
  secret: snapflow-redis

objectStorage:
  service: snapflow-rustfs
  secret: snapflow-rustfs
  region: us-east-1
  bucket: snapflow
  snapshotBucket: snapflow-snapshots

api:
  replicas: 1
  logLevel: info
  # SQL is logged only at this level or more verbose; statements can carry
  # personal data in their parameters, so production keeps it at warn.
  sqlLogLevel: warn
  geoIpDatabasePath: /opt/snapflow/geoip/dbip-city-lite.mmdb
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

dashboard:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

marketing:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

snapshotManager:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

edge:
  stateDirectory: /var/lib/snapflow/edge
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

edges: []
