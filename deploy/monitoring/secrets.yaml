apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-notifications
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: alertmanager-notifications
    creationPolicy: Owner
  data:
    - secretKey: pushover-user-key
      remoteRef:
        key: snapflow/alerts
        property: pushover-user-key
    - secretKey: pushover-token
      remoteRef:
        key: snapflow/alerts
        property: pushover-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: snapflow/platform/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: snapflow/platform/grafana
        property: admin-password
