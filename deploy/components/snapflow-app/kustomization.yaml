apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        interval: 10m
        timeout: 15m
        chart:
          spec:
            chart: ./deploy/charts/snapflow
            reconcileStrategy: Revision
            sourceRef:
              kind: GitRepository
              name: flux-system
              namespace: flux-system
        values:
          imageNamespace: snapflowio/snapflow
  - target:
      group: image.toolkit.fluxcd.io
      kind: ImageRepository
    patch: |-
      apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImageRepository
      metadata:
        name: _
        labels:
          app.kubernetes.io/part-of: snapflow
      spec:
        interval: 5m
  - target:
      group: image.toolkit.fluxcd.io
      kind: ImagePolicy
    patch: |-
      apiVersion: image.toolkit.fluxcd.io/v1
      kind: ImagePolicy
      metadata:
        name: _
      spec:
        interval: 5m
        digestReflectionPolicy: Always
        filterTags:
          pattern: '^build-[a-f0-9]{40}-(?P<timestamp>[0-9]+)$'
          extract: '$timestamp'
        policy:
          numerical:
            order: asc
