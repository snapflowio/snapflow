apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          crds: CreateReplace
          strategy:
            name: RetryOnFailure
        rollback:
          cleanupOnFail: true
        upgrade:
          cleanupOnFail: true
          crds: CreateReplace
          strategy:
            name: RemediateOnFailure
          remediation:
            remediateLastFailure: true
            retries: 2
