apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - snapflow.yaml
components:
  - ../../components/helm-release-defaults
patches:
  # The migration hook runs before the upgrade, so rolling the release back
  # would put the previous code on a schema the migration already changed.
  # A failed upgrade is retried instead; migrations stay backward compatible
  # with the running release (docs/deployment.md, "Database migrations").
  - target:
      kind: HelmRelease
      name: snapflow
    patch: |-
      - op: replace
        path: /spec/upgrade/strategy
        value:
          name: RetryOnFailure
          retryInterval: 5m
      - op: remove
        path: /spec/upgrade/remediation
