apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapflow
  namespace: snapflow
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: ./deploy/charts/snapflow
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  values:
    imageNamespace: snapflowio/snapflow
    domains:
      public: ${PUBLIC_DOMAIN}
      storage: ${STORAGE_DOMAIN}
      registry: ${REGISTRY_DOMAIN}
      platform: ${PLATFORM_DOMAIN}
    email:
      from: Snapflow <noreply@${EMAIL_DOMAIN}>
    # Base mainnet and Circle's USDC on it. The escrow address, its
    # deployment block and the USDC address are written from
    # apps/contracts/deployments/<chainId>.json by moon run
    # contracts:deploy-base (or deploy:settlement-values), and deploy:validate
    # fails when they differ; never edit them by hand. The Reown Cloud project
    # id is public. The chart refuses to render while any of them is empty.
    # The RPC URL carries a provider key, so it lives in OpenBao (moon run
    # deploy:openbao).
    settlement:
      chainId: 8453
      escrowAddress: ""
      escrowDeploymentBlock: ""
      usdcAddress: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      reownProjectId: ""
    images:
      api:
        tag: "" # {"$imagepolicy": "flux-system:snapflow-api:tag"}
        digest: "" # {"$imagepolicy": "flux-system:snapflow-api:digest"}
      dashboard:
        tag: "" # {"$imagepolicy": "flux-system:snapflow-dashboard:tag"}
        digest: "" # {"$imagepolicy": "flux-system:snapflow-dashboard:digest"}
      marketing:
        tag: "" # {"$imagepolicy": "flux-system:snapflow-marketing:tag"}
        digest: "" # {"$imagepolicy": "flux-system:snapflow-marketing:digest"}
      snapshotManager:
        tag: "" # {"$imagepolicy": "flux-system:snapflow-snapshot-manager:tag"}
        digest: "" # {"$imagepolicy": "flux-system:snapflow-snapshot-manager:digest"}
      edge:
        tag: "" # {"$imagepolicy": "flux-system:snapflow-edge:tag"}
        digest: "" # {"$imagepolicy": "flux-system:snapflow-edge:digest"}
    edges: []
