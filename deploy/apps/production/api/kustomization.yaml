apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
  - image.yaml
components:
  - ../../../components/helm-release-defaults
  - ../../../components/snapflow-app
patches:
  - target:
      kind: HelmRelease
      name: api
    patch: |-
      - op: replace
        path: /spec/upgrade/strategy
        value:
          name: RetryOnFailure
          retryInterval: 5m
      - op: remove
        path: /spec/upgrade/remediation
