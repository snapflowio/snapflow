packages:
  - apps/api
  - apps/dashboard
  - apps/docs
  - apps/marketing
  - libs/api-client
  - libs/consent
  - libs/contracts
  - libs/machine-proto
  - libs/organization-access
  - libs/sdk-typescript
  - libs/toolbox-api-client

nodeLinker: hoisted
catalogMode: prefer
cleanupUnusedCatalogs: true
autoInstallPeers: false
verifyDepsBeforeRun: error
strictDepBuilds: true
minimumReleaseAge: 2880

overrides:
  vite: 8.3.8
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2

auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-g3hv-75wg-m249

allowBuilds:
  '@reown/appkit': false
  '@scarf/scarf': false
  esbuild: true
  protobufjs: false
  sharp: true
  core-js: false

peerDependencyRules:
  allowedVersions:
    typescript: ^6.0.0
    'use-sync-external-store>react': ^19.0.0
    '@golevelup/nestjs-discovery@7.0.3>@nestjs/common': ^12.0.0
    '@golevelup/nestjs-discovery@7.0.3>@nestjs/core': ^12.0.0
    '@nest-lab/throttler-storage-redis@1.2.0>@nestjs/common': ^12.0.0
    '@nest-lab/throttler-storage-redis@1.2.0>@nestjs/core': ^12.0.0
    'runed@0.35.1>@sveltejs/kit': ^3.0.0

