[profile.default]
  src = "src"
  test = "test"
  script = "script"
  out = "out"
  libs = ["dependencies"]
  solc = "0.8.38"
  auto_detect_solc = false
  evm_version = "cancun"
  optimizer = true
  optimizer_runs = 200
  via_ir = true
  bytecode_hash = "none"
  extra_output_files = ["abi"]
  fs_permissions = [
    { access = "read-write", path = "./test/vectors" },
    { access = "read", path = "./script/createx" },
    { access = "read", path = "./script/safe" },
    { access = "write", path = "./deployments" },
  ]

[fmt]
  bracket_spacing = true
  int_types = "long"
  line_length = 120
  multiline_func_header = "all"
  number_underscore = "thousands"
  quote_style = "double"
  tab_width = 4
  wrap_comments = true

[lint]
  lint_on_build = false
  exclude_lints = ["block-timestamp", "reentrancy-events"]

[rpc_endpoints]
  base = "${BASE_RPC_URL}"
  base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
  base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
  base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[soldeer]
  remappings_generate = true
  remappings_regenerate = false
  remappings_location = "txt"
  remappings_version = false
  recursive_deps = false

[dependencies]
  "@openzeppelin-contracts" = "5.7.0"
  forge-std = "1.17.0"
