# Serves the marketing site on :8080 behind Traefik, as a non-root user on a
# read-only root filesystem where only /tmp is writable.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	access_log off;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	# Behind Traefik the listener port is not the public one, so redirects stay
	# relative to whatever host and scheme the visitor used.
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css text/plain text/xml application/javascript application/json
		application/manifest+json application/xml image/svg+xml;

	map $uri $cache_control {
		~^/_astro/ "public, max-age=31536000, immutable";
		/install.sh "no-store";
		default "no-cache";
	}

	server {
		listen 8080;
		root /srv/snapflow;

		# Headers are set once here with "always", and no block below sets
		# add_header, so every response (redirects and error pages included)
		# carries all of them; nginx drops inherited headers from any block that
		# adds its own.
		add_header Cache-Control $cache_control always;
		add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;

		location = /healthz {
			default_type text/plain;
			return 200 "ok";
		}

		location = /install.sh {
			return 302 https://github.com/snapflowio/snapflow/releases/latest/download/install.sh;
		}

		location / {
			try_files $uri $uri/index.html =404;
		}

		error_page 404 /404.html;
	}
}
