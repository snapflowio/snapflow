# Serves the dashboard on :8080 behind Traefik, as a non-root user on a
# read-only root filesystem where only /tmp is writable. At image build time
# scripts/render-nginx-config.ts replaces __BOOTSTRAP_SCRIPT_HASH__ with the
# hash of the SvelteKit fallback page's inline script.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	client_body_temp_path /tmp/client_body;
	proxy_temp_path /tmp/proxy;
	fastcgi_temp_path /tmp/fastcgi;
	uwsgi_temp_path /tmp/uwsgi;
	scgi_temp_path /tmp/scgi;

	access_log off;
	server_tokens off;
	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;

	# Behind Traefik the listener port is not the public one, so redirects stay
	# relative to whatever host and scheme the visitor used.
	absolute_redirect off;

	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types text/css text/plain text/xml application/javascript application/json
		application/manifest+json application/xml image/svg+xml;

	map $uri $cache_control {
		~^/_app/immutable/ "public, max-age=31536000, immutable";
		default "no-cache";
	}

	server {
		listen 8080;
		root /srv/snapflow;

		# Headers are set once here with "always", and no block below sets
		# add_header, so every response carries all of them; nginx drops
		# inherited headers from any block that adds its own.
		add_header Cache-Control $cache_control always;
		add_header Content-Security-Policy "default-src 'self'; script-src 'self' __BOOTSTRAP_SCRIPT_HASH__ https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://connect-js.stripe.com https://maps.googleapis.com; style-src 'self'; style-src-attr 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.stripe.com https://*.link.com; font-src 'self'; connect-src 'self' https://*.stripe.com https://*.stripe.network https://link.com https://*.link.com https://maps.googleapis.com; frame-src https://*.$host:* https://*.stripe.com https://*.stripe.network https://link.com https://*.link.com; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
		add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		add_header Permissions-Policy 'camera=(), geolocation=(), microphone=(), payment=(self "https://js.stripe.com" "https://*.js.stripe.com" "https://checkout.stripe.com" "https://link.com" "https://*.link.com"), usb=()' always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Strict-Transport-Security "max-age=31536000" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "DENY" always;

		location = /healthz {
			default_type text/plain;
			return 200 "ok";
		}

		location / {
			try_files $uri /200.html;
		}
	}
}
