inheritedBy:
  toolchain: "go"

tasks:
  typecheck:
    command: "go"
    args: ["vet", "./..."]

  test:
    command: "go"
    args: ["test", "./..."]

  lint:
    command: "golangci-lint"
    args: ["run", "./..."]

  format:
    command: "gofumpt"
    args: ["-extra", "-w", "."]
    options:
      cache: false

  tidy:
    command: "go"
    args: ["mod", "tidy"]
    options:
      cache: false
