name: Sync dev

# Commits that land on main without passing through dev (release-please
# releases, hotfixes and rollbacks) are merged back into dev through a pull
# request, so the next dev -> main promotion carries no stale history. The
# merge is made server-side with the merges API as the snapflowio-automation
# App, so no token is ever written to disk.

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Merge main into dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The App key is an environment secret only main may use.
    environment: automation
    permissions:
      contents: read
    env:
      SYNC_BRANCH: sync/main-into-dev
      SYNC_TITLE: "chore: merge main into dev"
    steps:
      # The snapflowio-automation App opens the pull request, so CI runs on it
      # like any other; workflows: write lets the merge carry workflow changes.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SNAPFLOW_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.SNAPFLOW_AUTOMATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Open or refresh the sync pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          repo="repos/${GITHUB_REPOSITORY}"
          main_sha="$(gh api "${repo}/git/ref/heads/main" --jq .object.sha)"
          dev_sha="$(gh api "${repo}/git/ref/heads/dev" --jq .object.sha)"
          read -r status changed_files < <(gh api "${repo}/compare/${dev_sha}...${main_sha}" \
            --jq '[.status, (.files | length)] | @tsv')
          if [ "$status" = identical ] || [ "$status" = behind ]; then
            echo "dev already contains main"
            exit 0
          fi
          # A promotion leaves only its merge commit on main, which changes
          # nothing relative to dev; merging it back would be an empty PR.
          if [ "$changed_files" -eq 0 ]; then
            echo "main is ahead only by commits that change no files"
            exit 0
          fi

          point_sync_branch() {
            if ! gh api -X PATCH "${repo}/git/refs/heads/${SYNC_BRANCH}" -f sha="$1" -F force=true >/dev/null 2>&1; then
              gh api -X POST "${repo}/git/refs" -f ref="refs/heads/${SYNC_BRANCH}" -f sha="$1" >/dev/null
            fi
          }

          point_sync_branch "$dev_sha"
          body="Merges commits that landed on \`main\` outside a promotion back into \`dev\`. Merge this with a merge commit, never squash."
          if ! merge_output="$(gh api -X POST "${repo}/merges" -f base="$SYNC_BRANCH" -f head="$main_sha" -f commit_message="$SYNC_TITLE" 2>&1)"; then
            if ! grep -q "Merge conflict" <<<"$merge_output"; then
              echo "$merge_output" >&2
              exit 1
            fi
            point_sync_branch "$main_sha"
            body="\`main\` and \`dev\` conflict, so this branch is \`main\` as is. Merge \`dev\` into it locally, resolve the conflicts, push, then merge this with a merge commit."
            echo "::warning::main and dev conflict; resolve ${SYNC_BRANCH} by hand"
          fi

          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base dev --state open --json number --jq '.[0].number // empty')"
          if [ -z "$open_pr" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base dev --head "$SYNC_BRANCH" --title "$SYNC_TITLE" --body "$body"
          else
            gh pr edit "$open_pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
