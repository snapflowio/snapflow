name: Publish images

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      application:
        description: Application image to publish
        required: true
        default: marketing
        type: choice
        options:
          - marketing
          - dashboard
          - api
          - snapshot-manager
          - edge

permissions:
  contents: read

env:
  CI: true
  MOON_TOOLCHAIN_FORCE_GLOBALS: true

jobs:
  changes:
    name: Select applications
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      applications: >-
        ${{ github.event_name == 'workflow_dispatch' &&
            format('["{0}"]', inputs.application) ||
            steps.paths.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - id: paths
        name: Detect application changes
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: ${{ github.ref }}
          filters: .github/filters/images.yml

  publish:
    name: Publish ${{ matrix.application }} image
    needs: changes
    if: >-
      github.ref == 'refs/heads/dev' &&
      needs.changes.outputs.applications != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        application: ${{ fromJSON(needs.changes.outputs.applications) }}
    concurrency:
      group: images-${{ matrix.application }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      APPLICATION: ${{ matrix.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.work

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - uses: ./.github/actions/deploy-tools

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate, build, scan and publish with moon
        run: pnpm exec moon run "${APPLICATION}:publish"

      - name: Read the published image
        id: image
        run: |
          metadata="dist/images/${APPLICATION}.json"
          reference="$(jq --exit-status --raw-output --arg target "$APPLICATION" '.[$target]["image.name"]' "$metadata")"
          digest="$(jq --exit-status --raw-output --arg target "$APPLICATION" '.[$target]["containerimage.digest"]' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "name=${reference%:*}"
            echo "tag=${reference##*:}"
            echo "digest=${digest}"
          } >>"$GITHUB_OUTPUT"

      - name: Register signed GitHub artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Summarize the published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "### ${APPLICATION} image"
            echo "- Image: \`${IMAGE}\`"
            echo "- Tag: \`${IMAGE_TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Flux pins this digest on dev; promoting dev to main deploys it."
          } >>"$GITHUB_STEP_SUMMARY"
