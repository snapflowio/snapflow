name: CodeQL

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 2"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Go must be installed and the generated sources in place before init,
      # so CodeQL traces the toolchain that compiles the workspace.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.language == 'go'
        with:
          go-version-file: go.work
          cache: false
      - uses: ./.github/actions/go-workspace
        if: matrix.language == 'go'
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Clients generated by @hey-api/openapi-ts are never edited by hand;
          # their fixes come from upgrading the generator, which Renovate does.
          config: |
            paths-ignore:
              - "**/*.gen.ts"
      - name: Build Go workspace
        if: matrix.language == 'go'
        run: ./scripts/go-workspace.sh go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
