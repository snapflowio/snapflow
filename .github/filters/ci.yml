# Which CI suites a pull request needs, by the files it changes. Pushes to
# main and manual runs always run every suite. A change under .github/ runs
# every suite, because it can change how any of them run.

go:
  - ".github/**"
  - "**/*.go"
  - "**/go.mod"
  - "**/go.sum"
  - "go.work"
  - "go.work.sum"
  - ".golangci.yml"
  - "scripts/go-workspace.sh"
  - "images/erofs-utils/**"
  - ".devcontainer/scripts/build-erofs-utils.sh"
  - "apps/guest/tools/**"

# The TypeScript suite also regenerates the API clients (from the API) and the
# local API documents (from the snapflow and guest Go sources).
typescript:
  - ".github/**"
  - "apps/api/**"
  - "apps/dashboard/**"
  - "apps/marketing/**"
  - "apps/snapflow/**"
  - "apps/guest/**"
  - "libs/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "biome.json"
  - "tsconfig*.json"
  - "moon.yml"
  - ".moon/**"
  - "**/*.{ts,tsx,mts,cts,js,mjs,cjs,json,jsonc,css,svelte,astro,html}"

# The Solidity contracts and the bindings generated from them, including the
# generators' versions (pnpm catalog, Go tool) and the Moon tasks that run them.
contracts:
  - ".github/**"
  - "apps/contracts/**"
  - "libs/contracts/**"
  - "libs/contracts-go/**"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "moon.yml"
  - ".moon/**"

deploy:
  - ".github/**"
  - "deploy/**"
  - "apps/contracts/deployments/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "moon.yml"
  - ".moon/**"

database:
  - ".github/**"
  - "apps/api/**"
  - "libs/machine-proto/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "moon.yml"
  - ".moon/**"
