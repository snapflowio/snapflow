name: Install deploy tools
description: Installs the pinned kubectl, Helm, Flux, kubeconform and Trivy versions the moon deploy tasks use

runs:
  using: composite
  steps:
    - name: Install pinned deploy tools
      shell: bash
      env:
        KUBECTL_URL: https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
        KUBECTL_SHA256: 65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8
        HELM_URL: https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
        HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        FLUX_URL: https://github.com/fluxcd/flux2/releases/download/v2.9.6/flux_2.9.6_linux_amd64.tar.gz
        FLUX_SHA256: b4d22673e9246cbd628881f1a9ef3b090085dced291e42d804555cee8e8d42c5
        KUBECONFORM_URL: https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
        KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        TRIVY_URL: https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
        TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        tools="${RUNNER_TEMP}/deploy-tools"
        downloads="${RUNNER_TEMP}/deploy-downloads"
        mkdir -p "${tools}" "${downloads}"
        download() {
          curl -fsSLo "${downloads}/$1" "$2"
          echo "$3  ${downloads}/$1" | sha256sum --check --quiet
        }
        download kubectl "${KUBECTL_URL}" "${KUBECTL_SHA256}"
        install -m 0755 "${downloads}/kubectl" "${tools}/kubectl"
        download helm.tar.gz "${HELM_URL}" "${HELM_SHA256}"
        tar -xzf "${downloads}/helm.tar.gz" -C "${tools}" --strip-components=1 linux-amd64/helm
        download flux.tar.gz "${FLUX_URL}" "${FLUX_SHA256}"
        tar -xzf "${downloads}/flux.tar.gz" -C "${tools}" flux
        download kubeconform.tar.gz "${KUBECONFORM_URL}" "${KUBECONFORM_SHA256}"
        tar -xzf "${downloads}/kubeconform.tar.gz" -C "${tools}" kubeconform
        download trivy.tar.gz "${TRIVY_URL}" "${TRIVY_SHA256}"
        tar -xzf "${downloads}/trivy.tar.gz" -C "${tools}" trivy
        echo "${tools}" >>"${GITHUB_PATH}"
