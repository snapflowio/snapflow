header:
  - license:
      spdx-id: AGPL-3.0
      copyright-owner: Snapflow
      software-name: Snapflow
      content: |
        Copyright (c) [year] [owner]. All rights reserved.

        [software-name] is licensed under the GNU Affero General Public License v3.0.
        You may obtain a copy of the license at https://www.gnu.org/licenses/agpl-3.0.html

        SPDX-License-Identifier: AGPL-3.0
      pattern: |
        Copyright (c) \d{4}(-\d{4})? Snapflow\. All rights reserved\.

        Snapflow is licensed under the GNU Affero General Public License v3\.0\.
        You may obtain a copy of the license at https://www\.gnu\.org/licenses/agpl-3\.0\.html

        SPDX-License-Identifier: AGPL-3\.0
    paths:
      - "apps/**/*.{ts,tsx,mts,cts,js,mjs,cjs,go,sh,py,css,html,svelte,sol}"
      - "apps/**/Dockerfile"
      - "scripts/**/*.{mts,sh}"
      - "deploy/**/*.sh"
      - "images/**/Dockerfile"
    paths-ignore:
      - "**/node_modules/**"
      - "**/dist/**"
      - ".tmp/**"
      - "**/.env*"
      - "**/*.md"
      - "**/*.json"
      - "**/*.{png,jpg,jpeg,gif,svg,ico,webp,woff,woff2}"
      - "**/*.lock"
      - "**/pnpm-lock.yaml"
      - "**/go.sum"
      - "**/*.pb.go"
      - "apps/guest/internal/toolbox/docs/**"
      - "apps/snapflow/internal/localapi/docs/**"
      - "apps/guest/internal/terminal/static/**"
      - "apps/marketing/.astro/**"
      - "apps/contracts/dependencies/**"
      - "apps/contracts/out/**"
      - "apps/contracts/cache/**"
      - "**/.svelte-kit/**"
      - "apps/api/src/migrations/*-migration.ts"
      - "libs/machine-proto/gen/**"
      - "libs/api-client/src/**"
      - "libs/toolbox-api-client/src/**"
    license-location-threshold: 80
    comment: on-failure
    language:
      TypeScript:
        extensions:
          - ".ts"
          - ".mts"
          - ".cts"
        comment_style_id: SlashAsterisk
      Svelte:
        extensions:
          - ".svelte"
        comment_style_id: AngleBracket
      Solidity:
        extensions:
          - ".sol"
        comment_style_id: DoubleSlash

  - license:
      spdx-id: Apache-2.0
      copyright-owner: Snapflow
      software-name: Snapflow
      content: |
